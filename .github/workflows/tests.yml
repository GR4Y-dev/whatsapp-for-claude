name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install requirements
        run: pip install -r gateway/requirements.txt
      - name: Check dependencies for known vulnerabilities
        run: |
          pip install pip-audit==2.10.1
          pip-audit -r gateway/requirements.txt
      - name: Check the setup script
        run: bash -n setup.sh && bash -n update.sh
      - name: Updater tests
        run: bash tests/test_update.sh
      - name: Gateway tests
        run: python tests/test_gateway.py
      - name: Security regression tests
        run: |
          python -m unittest discover -s tests -p test_security.py -v
          python -m unittest discover -s tests -p test_build_images.py -v
      - name: Build the gateway image
        run: docker build -q gateway
      - name: Build and test the smaller voice bridge
        run: |
          docker build -t bridge-test bridge
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          mkdir -m 777 /tmp/audio-smoke
          for format in wav mp3 m4a flac ogg; do
            ffmpeg -v error -f lavfi -i 'sine=frequency=440:duration=1' -y "/tmp/audio-smoke/in.$format"
            docker run --rm --entrypoint ffmpeg -v /tmp/audio-smoke:/samples bridge-test -v error -i "/samples/in.$format" -c:a libopus -b:a 32k -vbr on -compression_level 10 -y "/samples/out-$format.ogg"
            test "$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 "/tmp/audio-smoke/out-$format.ogg")" = opus
          done
          docker image inspect bridge-test --format '{{.Size}}'
